spring.application.name=astrovision-api
server.port=${SERVER_PORT:8080}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/astrovision}
spring.data.mongodb.auto-index-creation=true
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB
# AI_MODE, OLLAMA_BASE_URL and OLLAMA_MODEL are supplied by environment variables or @Value defaults.
management.endpoints.web.exposure.include=health,info
